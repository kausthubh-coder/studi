<!doctype html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="min-h-screen bg-gray-100 flex items-center justify-center p-6"><div class="bg-white rounded-2xl shadow-lg p-8 max-w-sm w-full text-center"><h1 class="text-2xl font-bold text-gray-800 mb-2">Toggle Button Demo</h1><p class="text-gray-500 text-sm mb-8">Click the button below to switch between ON and OFF states.</p><div id="statusBox" class="mb-6 rounded-xl py-4 px-6 bg-red-100 transition-colors duration-300"><p class="text-sm font-medium text-gray-600 mb-1">Current State</p><p id="statusText" class="text-3xl font-extrabold text-red-500">OFF</p></div><button id="toggleBtn" onclick="toggle()" class="w-full py-3 px-6 rounded-xl text-white font-semibold text-lg bg-red-400 hover:bg-red-500 active:scale-95 transition-all duration-200 shadow">Turn ON</button><p class="mt-6 text-xs text-gray-400">Each click flips the state between ON and OFF.</p></div><script>var isOn=false;function toggle(){isOn=!isOn;var btn=document.getElementById('toggleBtn');var statusText=document.getElementById('statusText');var statusBox=document.getElementById('statusBox');if(isOn){statusText.textContent='ON';statusText.className='text-3xl font-extrabold text-green-500';statusBox.className='mb-6 rounded-xl py-4 px-6 bg-green-100 transition-colors duration-300';btn.textContent='Turn OFF';btn.className='w-full py-3 px-6 rounded-xl text-white font-semibold text-lg bg-green-500 hover:bg-green-600 active:scale-95 transition-all duration-200 shadow';}else{statusText.textContent='OFF';statusText.className='text-3xl font-extrabold text-red-500';statusBox.className='mb-6 rounded-xl py-4 px-6 bg-red-100 transition-colors duration-300';btn.textContent='Turn ON';btn.className='w-full py-3 px-6 rounded-xl text-white font-semibold text-lg bg-red-400 hover:bg-red-500 active:scale-95 transition-all duration-200 shadow';}}</script></body></html>
