<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="bg-slate-900 flex flex-col items-center justify-center min-h-screen p-4"><div class="bg-slate-800 rounded-2xl shadow-xl p-4 w-full max-w-lg"><h1 class="text-white text-xl font-bold text-center mb-1">Derivative Tangent Line Intuition</h1><p class="text-slate-400 text-sm text-center mb-3">Drag the <span class="text-yellow-400 font-semibold">point</span> along the curve to see the tangent line and slope update.</p><canvas id="c" class="w-full rounded-xl bg-slate-950 touch-none" style="height:320px"></canvas><div class="mt-3 flex items-center justify-center gap-3"><div class="bg-slate-700 rounded-xl px-4 py-2 text-center"><div class="text-slate-400 text-xs">x</div><div id="xval" class="text-cyan-300 font-mono text-lg font-bold">0.00</div></div><div class="bg-slate-700 rounded-xl px-4 py-2 text-center"><div class="text-slate-400 text-xs">f(x) = x³ − 3x + 1</div><div id="fval" class="text-green-300 font-mono text-lg font-bold">1.00</div></div><div class="bg-slate-700 rounded-xl px-4 py-2 text-center"><div class="text-slate-400 text-xs">slope f′(x)</div><div id="dval" class="text-yellow-300 font-mono text-lg font-bold">-3.00</div></div></div><p class="text-slate-500 text-xs text-center mt-2">f′(x) = 3x² − 3</p></div><script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,ox,oy,scale;
let dragX=0;
let dragging=false;

function f(x){return x*x*x-3*x+1;}
function df(x){return 3*x*x-3;}

function resize(){
  const rect=canvas.getBoundingClientRect();
  W=canvas.width=rect.width*devicePixelRatio;
  H=canvas.height=rect.height*devicePixelRatio;
  ox=W/2;oy=H/2;
  scale=W/8;
  draw();
}

function toCanvas(x,y){return[ox+x*scale,oy-y*scale];}
function fromCanvas(cx){return(cx-ox)/scale;}

function draw(){
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
  for(let gx=-4;gx<=4;gx++){const[cx]=toCanvas(gx,0);ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();}
  for(let gy=-4;gy<=4;gy++){const[,cy]=toCanvas(0,gy);ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();}
  // axes
  ctx.strokeStyle='#475569';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();
  // axis labels
  ctx.fillStyle='#64748b';ctx.font=`${11*devicePixelRatio}px monospace`;ctx.textAlign='center';
  for(let gx=-3;gx<=3;gx+=1){if(gx===0)continue;const[cx]=toCanvas(gx,0);ctx.fillText(gx,cx,oy+14*devicePixelRatio);}
  // curve
  ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.beginPath();
  let first=true;
  for(let px=0;px<=W;px+=2){
    const x=fromCanvas(px);
    const y=f(x);
    const[,cy]=toCanvas(x,y);
    if(first){ctx.moveTo(px,cy);first=false;}else{ctx.lineTo(px,cy);}
  }
  ctx.stroke();
  // tangent line
  const fx=f(dragX);const slope=df(dragX);
  const ext=4;
  const x1=dragX-ext,x2=dragX+ext;
  const y1=fx+slope*(x1-dragX),y2=fx+slope*(x2-dragX);
  const[cx1,cy1]=toCanvas(x1,y1);const[cx2,cy2]=toCanvas(x2,y2);
  ctx.strokeStyle='#facc15';ctx.lineWidth=2.5;ctx.setLineDash([8*devicePixelRatio,5*devicePixelRatio]);
  ctx.beginPath();ctx.moveTo(cx1,cy1);ctx.lineTo(cx2,cy2);ctx.stroke();
  ctx.setLineDash([]);
  // point
  const[pcx,pcy]=toCanvas(dragX,fx);
  ctx.beginPath();ctx.arc(pcx,pcy,9*devicePixelRatio,0,Math.PI*2);
  ctx.fillStyle='#facc15';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  // update labels
  document.getElementById('xval').textContent=dragX.toFixed(2);
  document.getElementById('fval').textContent=fx.toFixed(2);
  const dEl=document.getElementById('dval');
  dEl.textContent=slope.toFixed(2);
  dEl.className='font-mono text-lg font-bold '+(slope>0.1?'text-green-300':slope<-0.1?'text-red-400':'text-yellow-300');
}

function getX(e){
  const rect=canvas.getBoundingClientRect();
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const ratio=W/rect.width;
  return fromCanvas((clientX-rect.left)*ratio);
}

canvas.addEventListener('pointerdown',e=>{dragging=true;dragX=Math.max(-3.5,Math.min(3.5,getX(e)));draw();});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;dragX=Math.max(-3.5,Math.min(3.5,getX(e)));draw();});
window.addEventListener('pointerup',()=>{dragging=false;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;dragX=Math.max(-3.5,Math.min(3.5,getX(e)));draw();},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!dragging)return;dragX=Math.max(-3.5,Math.min(3.5,getX(e)));draw();},{passive:false});

window.addEventListener('resize',resize);
resize();
</script></body></html>
