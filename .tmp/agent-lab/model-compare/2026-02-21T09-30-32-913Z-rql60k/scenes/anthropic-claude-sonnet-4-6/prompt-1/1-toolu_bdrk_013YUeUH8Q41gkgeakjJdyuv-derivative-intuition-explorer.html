<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-4"><h1 class="text-2xl font-bold mt-4 mb-1 text-blue-300">Derivative Intuition Explorer</h1><p class="text-sm text-gray-400 mb-3 text-center max-w-md">Drag the <span class="text-red-400 font-semibold">red point</span> along the curve. The <span class="text-blue-400 font-semibold">blue line</span> is the tangent; the <span class="text-yellow-400 font-semibold">yellow line</span> is the secant. Shrink Δx to see them converge!</p><canvas id="cv" class="rounded-xl border border-gray-700 touch-none" style="max-width:100%;cursor:ew-resize"></canvas><div class="flex flex-col items-center gap-2 mt-4 w-full max-w-md"><label class="text-sm text-gray-300">Δx = <span id="dxVal" class="text-yellow-300 font-bold">1.00</span></label><input id="dxSlider" type="range" min="0.05" max="3" step="0.05" value="1" class="w-full accent-yellow-400"/></div><div class="mt-3 bg-gray-800 rounded-lg px-5 py-3 text-sm text-center max-w-md"><div>f(x) = x³ − 3x &nbsp;|&nbsp; f′(x) = 3x² − 3</div><div class="mt-1">x = <span id="xVal" class="text-red-300 font-semibold">0.00</span> &nbsp;|&nbsp; f(x) = <span id="yVal" class="text-red-300 font-semibold">0.00</span> &nbsp;|&nbsp; f′(x) = <span id="dVal" class="text-blue-300 font-semibold">-3.00</span></div><div class="mt-1 text-yellow-300">Secant slope = <span id="sVal">—</span></div></div><script>const cv=document.getElementById('cv');const ctx=cv.getContext('2d');const dxSlider=document.getElementById('dxSlider');const dxValEl=document.getElementById('dxVal');const xValEl=document.getElementById('xVal');const yValEl=document.getElementById('yVal');const dValEl=document.getElementById('dVal');const sValEl=document.getElementById('sVal');let W,H,ox,oy,scale;let px=0;let dx=1;function f(x){return x*x*x-3*x;}function fp(x){return 3*x*x-3;}function resize(){const s=Math.min(window.innerWidth-32,520);cv.width=s;cv.height=Math.round(s*0.65);W=cv.width;H=cv.height;ox=W/2;oy=H/2;scale=W/9;draw();}function toC(x,y){return[ox+x*scale,oy-y*scale];}function fromC(cx){return(cx-ox)/scale;}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#374151';ctx.lineWidth=1;for(let i=-5;i<=5;i++){const[cx,cy]=toC(i,0);ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();const[ax,ay]=toC(0,i);ctx.beginPath();ctx.moveTo(0,ay);ctx.lineTo(W,ay);ctx.stroke();}ctx.strokeStyle='#6b7280';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();ctx.fillStyle='#9ca3af';ctx.font='11px sans-serif';ctx.textAlign='center';for(let i=-4;i<=4;i+=2){if(i===0)continue;const[cx]=toC(i,0);ctx.fillText(i,cx,oy+14);}ctx.textAlign='right';for(let i=-3;i<=3;i+=1){if(i===0)continue;const[,cy]=toC(0,i);ctx.fillText(i,ox-4,cy+4);}ctx.strokeStyle='#a78bfa';ctx.lineWidth=2.5;ctx.beginPath();let first=true;for(let cx=0;cx<=W;cx+=2){const x=fromC(cx);const y=f(x);const[,cy]=toC(x,y);if(first){ctx.moveTo(cx,cy);first=false;}else ctx.lineTo(cx,cy);}ctx.stroke();const fy=f(px);const fd=fp(px);const dxv=parseFloat(dxSlider.value);const x2=px+dxv;const fy2=f(x2);const secSlope=(fy2-fy)/dxv;const ext=6;const[tx1,ty1]=toC(px-ext,fy-ext*fd);const[tx2,ty2]=toC(px+ext,fy+ext*fd);ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx1,ty1);ctx.lineTo(tx2,ty2);ctx.stroke();const[sx1,sy1]=toC(px-ext,fy-ext*secSlope);const[sx2,sy2]=toC(px+ext,fy+ext*secSlope);ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(sx1,sy1);ctx.lineTo(sx2,sy2);ctx.stroke();ctx.setLineDash([]);const[px2,py2]=toC(x2,fy2);ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(px2,py2,5,0,Math.PI*2);ctx.fill();const[pcx,pcy]=toC(px,fy);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(pcx,pcy,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();xValEl.textContent=px.toFixed(2);yValEl.textContent=fy.toFixed(2);dValEl.textContent=fd.toFixed(2);dxValEl.textContent=dxv.toFixed(2);sValEl.textContent=secSlope.toFixed(2);}let dragging=false;function getX(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;return Math.max(-4,Math.min(4,fromC(cx*(W/r.width))));}cv.addEventListener('pointerdown',e=>{dragging=true;px=getX(e);draw();cv.setPointerCapture(e.pointerId);});cv.addEventListener('pointermove',e=>{if(!dragging)return;px=getX(e);draw();});cv.addEventListener('pointerup',()=>dragging=false);dxSlider.addEventListener('input',draw);window.addEventListener('resize',resize);resize();</script></body></html>
