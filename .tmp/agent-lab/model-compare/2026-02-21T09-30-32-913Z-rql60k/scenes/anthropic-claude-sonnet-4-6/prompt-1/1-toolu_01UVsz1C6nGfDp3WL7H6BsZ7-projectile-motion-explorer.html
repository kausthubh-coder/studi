<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-3"><h1 class="text-xl font-bold mb-1">Projectile Motion Explorer</h1><p class="text-xs text-gray-400 mb-3">Set angle, speed & gravity, then hit Launch 🚀</p><canvas id="c" class="rounded-lg border border-gray-600 w-full max-w-2xl" style="background:#111827"></canvas><div class="mt-3 w-full max-w-2xl bg-gray-800 rounded-lg p-4 grid grid-cols-1 gap-3"><div class="flex items-center gap-3"><label class="w-36 text-sm">Angle: <span id="lA">45</span>°</label><input id="sA" type="range" min="0" max="90" value="45" class="flex-1 accent-yellow-400"/></div><div class="flex items-center gap-3"><label class="w-36 text-sm">Speed: <span id="lS">50</span> m/s</label><input id="sS" type="range" min="10" max="100" value="50" class="flex-1 accent-green-400"/></div><div class="flex items-center gap-3"><label class="w-36 text-sm">Gravity: <span id="lG">9.8</span> m/s²</label><input id="sG" type="range" min="10" max="200" value="98" class="flex-1 accent-blue-400"/></div><div class="flex gap-3 items-center"><button id="btn" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2 rounded-lg transition">Launch 🚀</button><span id="info" class="text-xs text-gray-400"></span></div></div><script>(function(){const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');const sA=document.getElementById('sA'),sS=document.getElementById('sS'),sG=document.getElementById('sG');const lA=document.getElementById('lA'),lS=document.getElementById('lS'),lG=document.getElementById('lG');const btn=document.getElementById('btn'),info=document.getElementById('info');let W,H,scale,ox,oy,animId=null,t=0,dt=0.05,pts=[],px=0,py=0,flying=false;function resize(){const rect=canvas.parentElement.getBoundingClientRect();W=Math.min(rect.width,672);H=Math.round(W*0.5);canvas.width=W;canvas.height=H;}function params(){const a=+sA.value*Math.PI/180;const v=+sS.value;const g=+sG.value/10;return{a,v,g};}function trajectory(){const{a,v,g}=params();const vx=v*Math.cos(a),vy=v*Math.sin(a);const T=2*vy/g;const R=vx*T;const Hmax=vy*vy/(2*g);return{vx,vy,g,T,R,Hmax};}function buildPath(){const{vx,vy,g,T,R,Hmax}=trajectory();const steps=200;const path=[];for(let i=0;i<=steps;i++){const ti=T*i/steps;path.push({x:vx*ti,y:vy*ti-0.5*g*ti*ti});}return{path,R,Hmax,T};}function setScale(R,Hmax){const margin=0.12;const maxX=Math.max(R,1);const maxY=Math.max(Hmax,1);const sx=(W*(1-2*margin))/maxX;const sy=(H*(1-2*margin))/maxY;scale=Math.min(sx,sy);ox=W*margin;oy=H*(1-margin);}function toCanvas(x,y){return[ox+x*scale,oy-y*scale];}function draw(animPt){ctx.clearRect(0,0,W,H);const{path,R,Hmax}=buildPath();setScale(R,Hmax);ctx.strokeStyle='#6b7280';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#facc15';ctx.lineWidth=2;ctx.beginPath();path.forEach((p,i)=>{const[cx,cy]=toCanvas(p.x,p.y);i===0?ctx.moveTo(cx,cy):ctx.lineTo(cx,cy);});ctx.stroke();if(animPt){const[cx,cy]=toCanvas(animPt.x,animPt.y);ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fillStyle='#f97316';ctx.fill();}}function animate(){const{vx,vy,g,T}=trajectory();t+=dt;if(t>T){t=T;flying=false;btn.disabled=false;btn.textContent='Launch 🚀';}const x=vx*t,y=vy*t-0.5*g*t*t;draw({x,y});if(flying)animId=requestAnimationFrame(animate);}function preview(){if(!flying)draw(null);}function launch(){if(animId)cancelAnimationFrame(animId);const{T,R,Hmax}=buildPath();info.textContent=`Range: ${R.toFixed(1)}m | Max H: ${Hmax.toFixed(1)}m | Time: ${T.toFixed(1)}s`;t=0;flying=true;btn.disabled=true;btn.textContent='Flying…';animate();}sA.addEventListener('input',()=>{lA.textContent=sA.value;preview();});sS.addEventListener('input',()=>{lS.textContent=sS.value;preview();});sG.addEventListener('input',()=>{lG.textContent=(sG.value/10).toFixed(1);preview();});btn.addEventListener('click',launch);window.addEventListener('resize',()=>{resize();preview();});resize();preview();})();</script></body></html>
