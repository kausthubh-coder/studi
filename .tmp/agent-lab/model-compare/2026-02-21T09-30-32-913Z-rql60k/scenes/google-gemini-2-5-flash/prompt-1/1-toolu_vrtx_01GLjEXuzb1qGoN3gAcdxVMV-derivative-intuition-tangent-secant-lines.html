<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      body { @apply bg-gray-50 text-gray-800 flex flex-col items-center justify-center min-h-screen p-4; }
      canvas { @apply border border-gray-300 bg-white shadow-lg rounded-lg; }
      .controls { @apply mt-4 flex flex-col items-center gap-2; }
      .label { @apply font-semibold text-sm; }
      .value { @apply font-mono text-blue-700; }
    </style>
  
  </head>
  <body>
    <div class="max-w-xl w-full">
      <h1 class="text-2xl font-bold text-center mb-4">Derivative Intuition: Tangent & Secant Lines</h1>
      <p class="text-center text-sm mb-4">Drag point P along the curve. Drag point Q closer to P to see the secant line approach the tangent line.</p>
      <canvas id="derivativeCanvas" width="400" height="400"></canvas>
      <div class="controls">
        <div class="flex gap-4">
          <p class="label">Tangent Slope (at P): <span id="tangentSlope" class="value"></span></p>
          <p class="label">Secant Slope (P to Q): <span id="secantSlope" class="value"></span></p>
        </div>
        <div class="flex gap-4">
          <p class="label">Δx: <span id="deltaX" class="value"></span></p>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('derivativeCanvas');
      const ctx = canvas.getContext('2d');
      const tangentSlopeDisplay = document.getElementById('tangentSlope');
      const secantSlopeDisplay = document.getElementById('secantSlope');
      const deltaXDisplay = document.getElementById('deltaX');

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const SCALE = 20; // Pixels per unit
      const ORIGIN_X = WIDTH / 2;
      const ORIGIN_Y = HEIGHT / 2;

      // Function to graph: f(x) = x^2
      const f = (x) => x * x;
      const f_prime = (x) => 2 * x; // Derivative of f(x)

      let p_x = 0; // x-coordinate of point P
      let q_x = 1; // x-coordinate of point Q

      let isDraggingP = false;
      let isDraggingQ = false;

      function toCanvasX(x) { return ORIGIN_X + x * SCALE; }
      function toCanvasY(y) { return ORIGIN_Y - y * SCALE; }
      function fromCanvasX(cx) { return (cx - ORIGIN_X) / SCALE; }
      function fromCanvasY(cy) { return (ORIGIN_Y - cy) / SCALE; }

      function drawGrid() {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 0.5;

        for (let i = -WIDTH / 2; i <= WIDTH / 2; i += SCALE) {
          ctx.beginPath();
          ctx.moveTo(ORIGIN_X + i, 0);
          ctx.lineTo(ORIGIN_X + i, HEIGHT);
          ctx.stroke();
        }
        for (let i = -HEIGHT / 2; i <= HEIGHT / 2; i += SCALE) {
          ctx.beginPath();
          ctx.moveTo(0, ORIGIN_Y + i);
          ctx.lineTo(WIDTH, ORIGIN_Y + i);
          ctx.stroke();
        }
      }

      function drawAxes() {
        ctx.strokeStyle = '#a0a0a0';
        ctx.lineWidth = 1;

        // X-axis
        ctx.beginPath();
        ctx.moveTo(0, ORIGIN_Y);
        ctx.lineTo(WIDTH, ORIGIN_Y);
        ctx.stroke();

        // Y-axis
        ctx.beginPath();
        ctx.moveTo(ORIGIN_X, 0);
        ctx.lineTo(ORIGIN_X, HEIGHT);
        ctx.stroke();
      }

      function drawCurve() {
        ctx.strokeStyle = '#3b82f6'; // Blue
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let cx = 0; cx <= WIDTH; cx++) {
          const x = fromCanvasX(cx);
          const y = f(x);
          if (cx === 0) {
            ctx.moveTo(toCanvasX(x), toCanvasY(y));
          } else {
            ctx.lineTo(toCanvasX(x), toCanvasY(y));
          }
        }
        ctx.stroke();
      }

      function drawPoint(x, y, color, label) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(toCanvasX(x), toCanvasY(y), 5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.font = '12px Arial';
        ctx.fillText(label, toCanvasX(x) + 8, toCanvasY(y) - 8);
      }

      function drawTangentLine(x0, y0, slope) {
        ctx.strokeStyle = '#ef4444'; // Red
        ctx.lineWidth = 2;
        ctx.beginPath();
        const x1 = x0 - 5;
        const y1 = y0 - slope * 5;
        const x2 = x0 + 5;
        const y2 = y0 + slope * 5;
        ctx.moveTo(toCanvasX(x1), toCanvasY(y1));
        ctx.lineTo(toCanvasX(x2), toCanvasY(y2));
        ctx.stroke();
      }

      function drawSecantLine(x1, y1, x2, y2) {
        ctx.strokeStyle = '#10b981'; // Green
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toCanvasX(x1), toCanvasY(y1));
        ctx.lineTo(toCanvasX(x2), toCanvasY(y2));
        ctx.stroke();
      }

      function update() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        drawGrid();
        drawAxes();
        drawCurve();

        const p_y = f(p_x);
        const q_y = f(q_x);

        // Draw tangent line at P
        const tangentSlope = f_prime(p_x);
        drawTangentLine(p_x, p_y, tangentSlope);

        // Draw secant line from P to Q
        let secantSlope = 0;
        if (q_x !== p_x) {
          secantSlope = (q_y - p_y) / (q_x - p_x);
          drawSecantLine(p_x, p_y, q_x, q_y);
        }

        drawPoint(p_x, p_y, '#ef4444', 'P'); // Red for P
        drawPoint(q_x, q_y, '#10b981', 'Q'); // Green for Q

        tangentSlopeDisplay.textContent = tangentSlope.toFixed(2);
        secantSlopeDisplay.textContent = secantSlope.toFixed(2);
        deltaXDisplay.textContent = Math.abs(p_x - q_x).toFixed(2);
      }

      function getMousePos(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      }

      canvas.addEventListener('pointerdown', (e) => {
        const pos = getMousePos(e);
        const x = fromCanvasX(pos.x);
        const y = fromCanvasY(pos.y);

        const p_y = f(p_x);
        const q_y = f(q_x);

        const distP = Math.sqrt(Math.pow(x - p_x, 2) + Math.pow(y - p_y, 2));
        const distQ = Math.sqrt(Math.pow(x - q_x, 2) + Math.pow(y - q_y, 2));

        if (distP < 0.5) { // Check if click is near P
          isDraggingP = true;
        } else if (distQ < 0.5) { // Check if click is near Q
          isDraggingQ = true;
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (isDraggingP || isDraggingQ) {
          const pos = getMousePos(e);
          const new_x = fromCanvasX(pos.x);

          // Clamp x to reasonable bounds
          const clamped_x = Math.max(-9, Math.min(9, new_x));

          if (isDraggingP) {
            p_x = clamped_x;
            // Ensure Q is not exactly on P
            if (Math.abs(p_x - q_x) < 0.05) {
              q_x = p_x + (q_x > p_x ? 0.1 : -0.1);
            }
          } else if (isDraggingQ) {
            q_x = clamped_x;
            // Ensure Q is not exactly on P
            if (Math.abs(q_x - p_x) < 0.05) {
              q_x = p_x + (q_x > p_x ? 0.1 : -0.1);
            }
          }
          update();
        }
      });

      canvas.addEventListener('pointerup', () => {
        isDraggingP = false;
        isDraggingQ = false;
      });

      canvas.addEventListener('pointerleave', () => {
        isDraggingP = false;
        isDraggingQ = false;
      });

      update();
    </script>
  </body>
</html>
