<!doctype html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>canvas{background:#f8fafc;border-bottom:4px solid #64748b;touch-action:none;}</style>
  </head><body class="bg-slate-100 p-4 font-sans"><div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden"><div class="p-4 bg-slate-800 text-white flex justify-between items-center"><h1 class="text-lg font-bold">Projectile Motion Explorer</h1><button id="launchBtn" class="bg-blue-500 hover:bg-blue-400 px-4 py-1 rounded font-bold transition">LAUNCH</button></div><div class="relative"><canvas id="canvas" width="700" height="350" class="w-full h-auto"></canvas></div><div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50"><div class="flex flex-col"><label class="text-xs font-bold text-slate-500 uppercase">Angle: <span id="angleVal">45</span>°</label><input type="range" id="angle" min="0" max="90" value="45" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div><div class="flex flex-col"><label class="text-xs font-bold text-slate-500 uppercase">Initial Speed: <span id="speedVal">60</span> m/s</label><input type="range" id="speed" min="10" max="100" value="60" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div><div class="flex flex-col"><label class="text-xs font-bold text-slate-500 uppercase">Gravity: <span id="gravVal">9.8</span> m/s²</label><input type="range" id="gravity" min="1" max="20" step="0.1" value="9.8" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div></div><div class="p-2 text-center text-xs text-slate-400">Adjust sliders to see the predicted path, then hit Launch.</div></div><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),inputs=['angle','speed','gravity'],launchBtn=document.getElementById('launchBtn');let animationId=null,startTime=null;const state={angle:45,speed:60,gravity:9.8,isAnimating:false};function updateState(){inputs.forEach(id=>{const val=parseFloat(document.getElementById(id).value);state[id]=val;document.getElementById(id+'Val').innerText=val;});if(!state.isAnimating)draw();}function getPos(t,v0,angleDeg,g){const rad=angleDeg*Math.PI/180;return{x:v0*Math.cos(rad)*t,y:v0*Math.sin(rad)*t-0.5*g*t*t};}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const ground=canvas.height-20,startX=40;ctx.setLineDash([5,5]);ctx.strokeStyle='#cbd5e1';ctx.beginPath();for(let t=0;t<20;t+=0.1){const p=getPos(t,state.speed,state.angle,state.gravity);const dx=startX+p.x,dy=ground-p.y;if(dy>ground)break;t===0?ctx.moveTo(dx,dy):ctx.lineTo(dx,dy);}ctx.stroke();ctx.setLineDash([]);if(state.isAnimating){const elapsed=(performance.now()-startTime)/200;const p=getPos(elapsed,state.speed,state.angle,state.gravity);const dx=startX+p.x,dy=ground-p.y;ctx.beginPath();ctx.strokeStyle='#3b82f6';ctx.lineWidth=3;for(let t=0;t<=elapsed;t+=0.05){const pp=getPos(t,state.speed,state.angle,state.gravity);const px=startX+pp.x,py=ground-pp.y;t===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.stroke();ctx.beginPath();ctx.fillStyle='#1e293b';ctx.arc(dx,dy,6,0,Math.PI*2);ctx.fill();if(dy>=ground){state.isAnimating=false;cancelAnimationFrame(animationId);}}else{ctx.beginPath();ctx.fillStyle='#94a3b8';ctx.arc(startX,ground,6,0,Math.PI*2);ctx.fill();}}function animate(){draw();if(state.isAnimating)animationId=requestAnimationFrame(animate);}launchBtn.onclick=()=>{state.isAnimating=true;startTime=performance.now();animate();};inputs.forEach(id=>document.getElementById(id).oninput=updateState);updateState();</script></body></html>
