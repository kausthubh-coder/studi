<!doctype html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>body{touch-action:none;overflow:hidden}#canvas{cursor:crosshair;background:#f8fafc}</style>
  </head><body class="bg-slate-50 flex flex-col h-screen p-4 font-sans"><div class="max-w-2xl mx-auto w-full bg-white rounded-xl shadow-lg p-6 flex flex-col gap-4"><header> <h1 class="text-xl font-bold text-slate-800">Derivative Intuition</h1> <p class="text-sm text-slate-600">Drag the blue point or use the slider to see how the secant line becomes a tangent.</p></header><div class="relative border border-slate-200 rounded-lg overflow-hidden"><svg id="plot" viewBox="0 0 400 300" class="w-full h-64"><path id="curve" fill="none" stroke="#94a3b8" stroke-width="2"/><line id="secant" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4"/><circle id="pointQ" r="5" fill="#f43f5e"/><circle id="pointP" r="7" fill="#3b82f6" class="cursor-move"/><text id="slopeText" x="10" y="20" class="text-xs font-mono fill-slate-700"></text></svg></div><div class="space-y-4"><div class="flex flex-col gap-1"><label class="text-xs font-semibold text-slate-500 uppercase">Distance (Δx): <span id="dxVal">1.00</span></label><input type="range" id="dxSlider" min="0.01" max="2" step="0.01" value="1" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div><div class="p-3 bg-blue-50 rounded text-xs text-blue-800">The slope of the red line is <span class="font-bold">Δy / Δx</span>. As Δx approaches 0, this becomes the derivative at the blue point.</div></div></div><script>const svg=document.getElementById('plot'),curve=document.getElementById('curve'),pP=document.getElementById('pointP'),pQ=document.getElementById('pointQ'),secant=document.getElementById('secant'),dxSlider=document.getElementById('dxSlider'),dxVal=document.getElementById('dxVal'),slopeText=document.getElementById('slopeText');let px=0,dx=1;const f=x=>0.05*Math.pow(x,3)-0.5*x;const toX=val=>200+val*40,toY=val=>150-val*40,fromX=x=>(x-200)/40;function update(){let d='';for(let x=-5;x<=5;x+=0.1)d+=(x===-5?'M':'L')+` ${toX(x)} ${toY(f(x))}`;curve.setAttribute('path',d);curve.setAttribute('d',d);const py=f(px),qx=px+dx,qy=f(qx);pP.setAttribute('cx',toX(px));pP.setAttribute('cy',toY(py));pQ.setAttribute('cx',toX(qx));pQ.setAttribute('cy',toY(qy));const slope=(qy-py)/(qx-px);const x1=px-5,y1=py-5*slope,x2=qx+5,y2=qy+5*slope;secant.setAttribute('x1',toX(x1));secant.setAttribute('y1',toY(y1));secant.setAttribute('x2',toX(x2));secant.setAttribute('y2',toY(y2));dxVal.textContent=dx.toFixed(2);slopeText.textContent=`Slope (m) = ${slope.toFixed(3)}`;}function handleMove(e){const rect=svg.getBoundingClientRect();const x=e.touches?e.touches[0].clientX:e.clientX;px=Math.max(-4,Math.min(4-dx,fromX(x-rect.left-10)));update();}dxSlider.oninput=e=>{dx=parseFloat(e.target.value);update()};pP.onmousedown=()=>document.onmousemove=handleMove;pP.ontouchstart=()=>document.ontouchmove=handleMove;document.onmouseup=document.ontouchend=()=>{document.onmousemove=null;document.ontouchmove=null};update();</script></body></html>
