<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="bg-gray-950 text-white flex flex-col items-center min-h-screen p-3"><h1 class="text-xl font-bold text-indigo-400 mt-2">Derivative Intuition Explorer</h1><p class="text-xs text-gray-400 mb-2 text-center">Drag the <span class="text-red-400 font-semibold">red point</span> along the curve. Adjust <span class="text-green-400 font-semibold">Δx</span> to see the secant approach the tangent.</p><canvas id="cv" class="rounded-xl border border-gray-700 bg-gray-900 touch-none" width="560" height="380"></canvas><div class="flex flex-col sm:flex-row gap-3 mt-3 items-center w-full max-w-lg"><label class="flex flex-col items-center text-xs text-gray-300 w-full"><span>Δx = <span id="dxVal" class="text-green-400 font-bold">1.00</span></span><input id="dxSlider" type="range" min="0.05" max="3" step="0.05" value="1" class="w-full accent-green-400"/></label><div class="bg-gray-800 rounded-lg px-4 py-2 text-sm text-center min-w-[180px]"><div>x = <span id="xVal" class="text-red-400 font-semibold">0.00</span></div><div>f(x) = <span id="fVal" class="text-yellow-300 font-semibold">1.00</span></div><div>f′(x) = <span id="slopeVal" class="text-blue-400 font-semibold">-3.00</span></div><div>Secant slope = <span id="secVal" class="text-green-400 font-semibold">—</span></div></div></div><p class="text-xs text-gray-500 mt-2">f(x) = x³ − 3x + 1 &nbsp;|&nbsp; f′(x) = 3x² − 3</p><script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const dxSlider=document.getElementById('dxSlider');
const dxVal=document.getElementById('dxVal');
const xVal=document.getElementById('xVal');
const fVal=document.getElementById('fVal');
const slopeVal=document.getElementById('slopeVal');
const secVal=document.getElementById('secVal');
let px=0,dragging=false;
const W=560,H=380;
const xMin=-3,xMax=3;
const yMin=-4,yMax=6;
function toC(x,y){return[(x-xMin)/(xMax-xMin)*W,(1-(y-yMin)/(yMax-yMin))*H];}
function fromC(cx){return xMin+cx/W*(xMax-xMin);}
function f(x){return x*x*x-3*x+1;}
function fp(x){return 3*x*x-3;}
function draw(){
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#1f2937';ctx.lineWidth=1;
  for(let x=Math.ceil(xMin);x<=xMax;x++){const[cx]=toC(x,0);ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();}
  for(let y=Math.ceil(yMin);y<=yMax;y++){const[,cy]=toC(0,y);ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();}
  // axes
  ctx.strokeStyle='#4b5563';ctx.lineWidth=1.5;
  const[ax]=toC(0,0);const[,ay]=toC(0,0);
  ctx.beginPath();ctx.moveTo(0,ay);ctx.lineTo(W,ay);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ax,0);ctx.lineTo(ax,H);ctx.stroke();
  // curve
  ctx.strokeStyle='#a78bfa';ctx.lineWidth=2.5;ctx.beginPath();
  for(let i=0;i<=W;i++){const x=fromC(i);const[cx,cy]=toC(x,f(x));i===0?ctx.moveTo(cx,cy):ctx.lineTo(cx,cy);}
  ctx.stroke();
  const dx=parseFloat(dxSlider.value);
  const fy=f(px);const slope=fp(px);
  // secant line
  const x2=px+dx;const fy2=f(x2);
  const secSlope=(fy2-fy)/dx;
  const ext=4;
  const[sx1,sy1]=toC(px-ext,fy-ext*secSlope);
  const[sx2,sy2]=toC(px+ext,fy+ext*secSlope);
  ctx.strokeStyle='#34d399';ctx.lineWidth=1.8;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(sx1,sy1);ctx.lineTo(sx2,sy2);ctx.stroke();
  ctx.setLineDash([]);
  // secant point Q
  if(x2>=xMin&&x2<=xMax){
    const[qx,qy]=toC(x2,fy2);
    ctx.fillStyle='#34d399';ctx.beginPath();ctx.arc(qx,qy,5,0,Math.PI*2);ctx.fill();
  }
  // tangent line
  const[tx1,ty1]=toC(px-ext,fy-ext*slope);
  const[tx2,ty2]=toC(px+ext,fy+ext*slope);
  ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(tx1,ty1);ctx.lineTo(tx2,ty2);ctx.stroke();
  // point P
  const[pcx,pcy]=toC(px,fy);
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(pcx,pcy,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  // labels
  xVal.textContent=px.toFixed(2);
  fVal.textContent=fy.toFixed(2);
  slopeVal.textContent=slope.toFixed(2);
  secVal.textContent=secSlope.toFixed(2);
  dxVal.textContent=dx.toFixed(2);
}
function getX(e){
  const r=cv.getBoundingClientRect();
  const scaleX=W/r.width;
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return Math.max(xMin,Math.min(xMax,fromC(cx*scaleX)));
}
cv.addEventListener('pointerdown',e=>{dragging=true;px=getX(e);draw();cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(dragging){px=getX(e);draw();}});
cv.addEventListener('pointerup',()=>dragging=false);
dxSlider.addEventListener('input',draw);
draw();
</script></body></html>
