<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      body {
        @apply font-sans bg-gray-50 text-gray-800 flex flex-col items-center justify-center min-h-screen p-4;
      }
      .container {
        @apply bg-white rounded-lg shadow-lg p-6 max-w-2xl w-full;
      }
      canvas {
        @apply border border-gray-300 rounded-md bg-white;
      }
      .controls {
        @apply mt-4 grid grid-cols-1 md:grid-cols-2 gap-4;
      }
      .control-group {
        @apply flex flex-col;
      }
      label {
        @apply text-sm font-medium text-gray-700 mb-1;
      }
      input[type="range"] {
        @apply w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer;
      }
      .info-box {
        @apply mt-4 p-3 bg-gray-100 rounded-md text-sm;
      }
      .info-item {
        @apply flex justify-between;
      }
    </style>
  
  </head>
  <body>
    <div class="container">
      <h1 class="text-2xl font-bold text-center mb-4">Derivative Intuition Explorer</h1>
      <p class="text-center text-gray-600 mb-4">Drag point P along the curve, adjust Δx, and observe the secant line approaching the tangent line.</p>
      <canvas id="derivativeCanvas" width="600" height="400"></canvas>
      <div class="controls">
        <div class="control-group">
          <label for="deltaXSlider">Δx:</label>
          <input type="range" id="deltaXSlider" min="0.01" max="2" value="0.5" step="0.01">
        </div>
        <div class="control-group">
          <label>Current Δx: <span id="deltaXValue">0.50</span></label>
        </div>
      </div>
      <div class="info-box">
        <div class="info-item"><span>P(x, f(x)):</span> <span id="pointPCoords"></span></div>
        <div class="info-item"><span>Q(x+Δx, f(x+Δx)):</span> <span id="pointQCoords"></span></div>
        <div class="info-item"><span>Secant Slope (PQ):</span> <span id="secantSlope"></span></div>
        <div class="info-item"><span>Tangent Slope (at P):</span> <span id="tangentSlope"></span></div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('derivativeCanvas');
      const ctx = canvas.getContext('2d');
      const deltaXSlider = document.getElementById('deltaXSlider');
      const deltaXValueSpan = document.getElementById('deltaXValue');
      const pointPCoordsSpan = document.getElementById('pointPCoords');
      const pointQCoordsSpan = document.getElementById('pointQCoords');
      const secantSlopeSpan = document.getElementById('secantSlope');
      const tangentSlopeSpan = document.getElementById('tangentSlope');

      let scaleX = 50; // Pixels per unit
      let scaleY = 50; // Pixels per unit
      let originX = canvas.width / 2;
      let originY = canvas.height / 2;

      let pX = 0.5; // Initial x-coordinate for point P
      let deltaX = parseFloat(deltaXSlider.value);

      let isDraggingP = false;

      // Function to convert canvas coordinates to math coordinates
      function toMathX(px) { return (px - originX) / scaleX; }
      function toMathY(py) { return (originY - py) / scaleY; }
      // Function to convert math coordinates to canvas coordinates
      function toCanvasX(x) { return x * scaleX + originX; }
      function toCanvasY(y) { return originY - y * scaleY; }

      // The function f(x) = x^2
      function f(x) { return x * x; }
      // The derivative f'(x) = 2x
      function fPrime(x) { return 2 * x; }

      function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw axes
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, originY); ctx.lineTo(canvas.width, originY); // X-axis
        ctx.moveTo(originX, 0); ctx.lineTo(originX, canvas.height); // Y-axis
        ctx.stroke();

        // Draw grid lines and labels
        ctx.strokeStyle = '#eee';
        ctx.font = '10px Arial';
        ctx.fillStyle = '#666';

        // Vertical grid lines
        for (let x = -Math.floor(originX / scaleX); x * scaleX + originX < canvas.width; x++) {
          if (x === 0) continue;
          ctx.beginPath();
          ctx.moveTo(toCanvasX(x), 0); ctx.lineTo(toCanvasX(x), canvas.height);
          ctx.stroke();
          ctx.fillText(x, toCanvasX(x) + 2, originY + 10);
        }
        // Horizontal grid lines
        for (let y = -Math.floor(originY / scaleY); y * scaleY + originY < canvas.height; y++) {
          if (y === 0) continue;
          ctx.beginPath();
          ctx.moveTo(0, toCanvasY(y)); ctx.lineTo(canvas.width, toCanvasY(y));
          ctx.stroke();
          ctx.fillText(y, originX + 2, toCanvasY(y) - 2);
        }

        // Axis labels
        ctx.fillText('x', canvas.width - 10, originY - 5);
        ctx.fillText('y', originX + 5, 10);
      }

      function drawFunction() {
        ctx.beginPath();
        ctx.strokeStyle = 'blue';
        ctx.lineWidth = 2;
        let firstPoint = true;
        for (let px = 0; px <= canvas.width; px++) {
          const x = toMathX(px);
          const y = f(x);
          const py = toCanvasY(y);
          if (firstPoint) {
            ctx.moveTo(px, py);
            firstPoint = false;
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.stroke();
      }

      function drawPointsAndLines() {
        const pY = f(pX);
        const qX = pX + deltaX;
        const qY = f(qX);

        const pCanvasX = toCanvasX(pX);
        const pCanvasY = toCanvasY(pY);
        const qCanvasX = toCanvasX(qX);
        const qCanvasY = toCanvasY(qY);

        // Draw point P
        ctx.beginPath();
        ctx.arc(pCanvasX, pCanvasY, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'red';
        ctx.fill();
        ctx.strokeStyle = 'black';
        ctx.stroke();

        // Draw point Q
        ctx.beginPath();
        ctx.arc(qCanvasX, qCanvasY, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'green';
        ctx.fill();
        ctx.strokeStyle = 'black';
        ctx.stroke();

        // Draw secant line (PQ)
        ctx.beginPath();
        ctx.strokeStyle = 'orange';
        ctx.lineWidth = 2;
        ctx.moveTo(pCanvasX, pCanvasY);
        ctx.lineTo(qCanvasX, qCanvasY);
        ctx.stroke();

        // Draw tangent line at P
        const tangentSlope = fPrime(pX);
        ctx.beginPath();
        ctx.strokeStyle = 'purple';
        ctx.lineWidth = 2;
        // Extend tangent line for better visualization
        const tangentLength = 100;
        const angle = Math.atan(tangentSlope);
        ctx.moveTo(pCanvasX - tangentLength * Math.cos(angle), pCanvasY + tangentLength * Math.sin(angle));
        ctx.lineTo(pCanvasX + tangentLength * Math.cos(angle), pCanvasY - tangentLength * Math.sin(angle));
        ctx.stroke();

        // Update info display
        const secantSlope = (qY - pY) / (qX - pX);
        pointPCoordsSpan.textContent = `(${pX.toFixed(2)}, ${pY.toFixed(2)})`;
        pointQCoordsSpan.textContent = `(${qX.toFixed(2)}, ${qY.toFixed(2)})`;
        secantSlopeSpan.textContent = secantSlope.toFixed(2);
        tangentSlopeSpan.textContent = tangentSlope.toFixed(2);
      }

      function draw() {
        drawGrid();
        drawFunction();
        drawPointsAndLines();
      }

      // Event Listeners
      deltaXSlider.addEventListener('input', () => {
        deltaX = parseFloat(deltaXSlider.value);
        deltaXValueSpan.textContent = deltaX.toFixed(2);
        draw();
      });

      canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const pCanvasX = toCanvasX(pX);
        const pCanvasY = toCanvasY(f(pX));

        // Check if pointer is near point P
        const dist = Math.sqrt(Math.pow(mouseX - pCanvasX, 2) + Math.pow(mouseY - pCanvasY, 2));
        if (dist < 10) { // 10px radius for dragging
          isDraggingP = true;
          canvas.style.cursor = 'grabbing';
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isDraggingP) return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const newPX = toMathX(mouseX);

        // Constrain pX to a reasonable range
        if (newPX > -3 && newPX < 3) {
          pX = newPX;
          draw();
        }
      });

      canvas.addEventListener('pointerup', () => {
        isDraggingP = false;
        canvas.style.cursor = 'grab';
      });

      canvas.addEventListener('pointerleave', () => {
        isDraggingP = false;
        canvas.style.cursor = 'grab';
      });

      // Initial draw
      draw();
      deltaXValueSpan.textContent = deltaX.toFixed(2);
      canvas.style.cursor = 'grab';

      // Handle canvas resizing (responsive behavior)
      function resizeCanvas() {
        const containerWidth = canvas.parentElement.clientWidth;
        canvas.width = Math.min(containerWidth, 600);
        canvas.height = Math.min(canvas.width * (2/3), 400);
        originX = canvas.width / 2;
        originY = canvas.height / 2;
        scaleX = canvas.width / 10; // Adjust scale based on new width
        scaleY = canvas.height / 8; // Adjust scale based on new height
        draw();
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas(); // Initial call
    </script>
  </body>
</html>
