<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @layer base {
        body { @apply font-sans bg-gray-100 text-gray-800 flex flex-col md:flex-row h-screen overflow-hidden; }
        .controls-panel { @apply p-4 bg-white shadow-lg flex flex-col gap-4 md:w-1/3 lg:w-1/4 xl:w-1/5; }
        .canvas-container { @apply flex-grow bg-gray-900 relative overflow-hidden; }
        .slider-group { @apply flex flex-col gap-1; }
        .slider-group label { @apply text-sm font-medium; }
        .slider-group input[type="range"] { @apply w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer; }
        .button { @apply px-4 py-2 rounded-md font-semibold transition-colors; }
        .button-primary { @apply bg-blue-600 text-white hover:bg-blue-700; }
        .button-secondary { @apply bg-gray-200 text-gray-800 hover:bg-gray-300; }
      }
    </style>
  
  </head>
  <body>
    <div class="controls-panel">
      <h2 class="text-xl font-bold mb-2">Projectile Controls</h2>
      <p class="text-sm text-gray-600 mb-4">Adjust parameters and click Launch!</p>

      <div class="slider-group">
        <label for="angle">Launch Angle: <span id="angleValue">45</span>°</label>
        <input type="range" id="angle" min="0" max="90" value="45">
      </div>

      <div class="slider-group">
        <label for="speed">Launch Speed: <span id="speedValue">50</span> m/s</label>
        <input type="range" id="speed" min="10" max="100" value="50">
      </div>

      <div class="slider-group">
        <label for="gravity">Gravity: <span id="gravityValue">9.8</span> m/s²</label>
        <input type="range" id="gravity" min="1" max="20" value="9.8" step="0.1">
      </div>

      <div class="flex gap-2 mt-4">
        <button id="launchBtn" class="button button-primary flex-grow">Launch</button>
        <button id="resetBtn" class="button button-secondary flex-grow">Reset</button>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="projectileCanvas" class="w-full h-full"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('projectileCanvas');
      const ctx = canvas.getContext('2d');

      const angleSlider = document.getElementById('angle');
      const speedSlider = document.getElementById('speed');
      const gravitySlider = document.getElementById('gravity');
      const angleValueSpan = document.getElementById('angleValue');
      const speedValueSpan = document.getElementById('speedValue');
      const gravityValueSpan = document.getElementById('gravityValue');
      const launchBtn = document.getElementById('launchBtn');
      const resetBtn = document.getElementById('resetBtn');

      let animationFrameId = null;
      let trajectoryPoints = [];
      let currentX = 0;
      let currentY = 0;
      let time = 0;
      let isLaunching = false;

      const scale = 5; // Pixels per meter

      function updateSliderValues() {
        angleValueSpan.textContent = angleSlider.value;
        speedValueSpan.textContent = speedSlider.value;
        gravityValueSpan.textContent = gravitySlider.value;
      }

      function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawGrid();
        if (!isLaunching) {
          drawTrajectory();
        }
      }

      function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(100, 116, 139, 0.3)'; // Subtle gray
        ctx.lineWidth = 0.5;

        const gridSize = 50; // Pixels

        // Vertical lines
        for (let x = 0; x < canvas.width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        // Horizontal lines
        for (let y = 0; y < canvas.height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      function drawTrajectory() {
        drawGrid();

        if (trajectoryPoints.length === 0) return;

        ctx.beginPath();
        ctx.strokeStyle = '#3b82f6'; // Blue
        ctx.lineWidth = 2;
        ctx.moveTo(trajectoryPoints[0].x, trajectoryPoints[0].y);
        for (let i = 1; i < trajectoryPoints.length; i++) {
          ctx.lineTo(trajectoryPoints[i].x, trajectoryPoints[i].y);
        }
        ctx.stroke();

        // Draw projectile
        if (trajectoryPoints.length > 0) {
          const lastPoint = trajectoryPoints[trajectoryPoints.length - 1];
          ctx.beginPath();
          ctx.arc(lastPoint.x, lastPoint.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#ef4444'; // Red
          ctx.fill();
        }
      }

      function calculateProjectilePosition(t) {
        const angleRad = (parseFloat(angleSlider.value) * Math.PI) / 180;
        const speed = parseFloat(speedSlider.value);
        const gravity = parseFloat(gravitySlider.value);

        const vx = speed * Math.cos(angleRad);
        const vy = speed * Math.sin(angleRad);

        const x = vx * t;
        const y = vy * t - 0.5 * gravity * t * t;

        // Convert to canvas coordinates
        const canvasX = x * scale;
        const canvasY = canvas.height - (y * scale); // Invert Y-axis for canvas

        return { x: canvasX, y: canvasY };
      }

      function animate() {
        if (!isLaunching) return;

        time += 0.05; // Increment time
        const { x, y } = calculateProjectilePosition(time);

        if (y > canvas.height + 10 || x > canvas.width + 10) { // Off screen or below ground
          isLaunching = false;
          return;
        }

        trajectoryPoints.push({ x, y });
        drawTrajectory();

        animationFrameId = requestAnimationFrame(animate);
      }

      function launchProjectile() {
        if (isLaunching) return;
        resetSimulation(); // Clear previous trajectory
        isLaunching = true;
        time = 0;
        animationFrameId = requestAnimationFrame(animate);
      }

      function resetSimulation() {
        cancelAnimationFrame(animationFrameId);
        isLaunching = false;
        trajectoryPoints = [];
        time = 0;
        drawGrid(); // Clear canvas and redraw grid
      }

      // Event Listeners
      angleSlider.addEventListener('input', updateSliderValues);
      speedSlider.addEventListener('input', updateSliderValues);
      gravitySlider.addEventListener('input', updateSliderValues);
      launchBtn.addEventListener('click', launchProjectile);
      resetBtn.addEventListener('click', resetSimulation);
      window.addEventListener('resize', resizeCanvas);

      // Initial setup
      updateSliderValues();
      resizeCanvas();
    </script>
  </body>
</html>
