<!doctype html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>canvas { touch-action: none; }</style>
  </head><body class="bg-slate-50 p-4 font-sans text-slate-800"><div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6"><h1 class="text-xl font-bold mb-2">Derivative Intuition Explorer</h1><p class="text-sm text-slate-600 mb-4">Drag the <b>red point</b> to move x. Use the slider to shrink <b>Δx</b>. When Δx is near zero, the blue secant line becomes the green tangent line.</p><div class="relative flex justify-center bg-slate-100 rounded-lg border border-slate-200 mb-6"><canvas id="graph" width="600" height="420" class="max-w-full h-auto cursor-crosshair"></canvas></div><div class="space-y-4"><div class="flex flex-col gap-2"><label class="text-sm font-semibold flex justify-between"><span>Interval (Δx): <span id="dxVal">1.00</span></span></label><input type="range" id="dxSlider" min="0.01" max="2" step="0.01" value="1.0" class="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer"></div><div class="grid grid-cols-2 gap-4 text-xs font-mono bg-slate-50 p-3 rounded border border-slate-200"><div>Point P: (<span id="pX">0</span>, <span id="pY">0</span>)</div><div>Slope (m): <span id="slopeVal">0</span></div></div></div></div><script>const canvas = document.getElementById('graph');const ctx = canvas.getContext('2d');const dxSlider = document.getElementById('dxSlider');const dxVal = document.getElementById('dxVal');const pXDisp = document.getElementById('pX');const pYDisp = document.getElementById('pY');const slopeDisp = document.getElementById('slopeVal');let x0 = 1; let dx = 1.0; let isDragging = false;const scale = 70; const origin = { x: 300, y: 300 };const f = (x) => x * x;const toCanvas = (x, y) => ({ x: origin.x + x * scale, y: origin.y - y * scale });const fromCanvas = (cx) => (cx - origin.x) / scale;function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(0, origin.y); ctx.lineTo(canvas.width, origin.y); ctx.moveTo(origin.x, 0); ctx.lineTo(origin.x, canvas.height); ctx.stroke(); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = -4; i <= 4; i += 0.1) { const p = toCanvas(i, f(i)); if (i === -4) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); } ctx.stroke(); const x1 = x0 + dx; const y0 = f(x0); const y1 = f(x1); const slope = (y1 - y0) / dx; const p0 = toCanvas(x0, y0); const p1 = toCanvas(x1, y1); ctx.setLineDash([5, 5]); ctx.strokeStyle = '#3b82f6'; ctx.beginPath(); const xStart = x0 - 2; const xEnd = x1 + 2; ctx.moveTo(toCanvas(xStart, y0 + slope * (xStart - x0)).x, toCanvas(xStart, y0 + slope * (xStart - x0)).y); ctx.lineTo(toCanvas(xEnd, y0 + slope * (xEnd - x0)).x, toCanvas(xEnd, y0 + slope * (xEnd - x0)).y); ctx.stroke(); ctx.setLineDash([]); const tangentSlope = 2 * x0; ctx.strokeStyle = '#22c55e'; ctx.beginPath(); ctx.moveTo(toCanvas(x0 - 1, y0 - tangentSlope).x, toCanvas(x0 - 1, y0 - tangentSlope).y); ctx.lineTo(toCanvas(x0 + 1, y0 + tangentSlope).x, toCanvas(x0 + 1, y0 + tangentSlope).y); ctx.stroke(); ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(p1.x, p1.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(p0.x, p0.y, 6, 0, Math.PI * 2); ctx.fill(); pXDisp.innerText = x0.toFixed(2); pYDisp.innerText = y0.toFixed(2); slopeDisp.innerText = slope.toFixed(2); dxVal.innerText = dx.toFixed(2);}function handleMove(e) { if (!isDragging) return; const rect = canvas.getBoundingClientRect(); const clientX = e.touches ? e.touches[0].clientX : e.clientX; x0 = Math.max(-3, Math.min(3, fromCanvas(clientX - rect.left))); draw();}canvas.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e); });canvas.addEventListener('touchstart', (e) => { isDragging = true; handleMove(e); });window.addEventListener('mousemove', handleMove);window.addEventListener('touchmove', handleMove);window.addEventListener('mouseup', () => isDragging = false);window.addEventListener('touchend', () => isDragging = false);dxSlider.addEventListener('input', (e) => { dx = parseFloat(e.target.value); draw(); });draw();</script></body></html>
