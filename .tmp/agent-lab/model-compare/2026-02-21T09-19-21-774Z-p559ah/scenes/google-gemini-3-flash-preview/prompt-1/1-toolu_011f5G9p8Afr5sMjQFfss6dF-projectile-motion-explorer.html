<!doctype html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>canvas { background: #f8fafc; border-bottom: 4px solid #64748b; touch-action: none; }</style>
  </head><body class="bg-slate-50 p-4 font-sans"><div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden"><div class="p-4 bg-slate-800 text-white flex justify-between items-center"><h1 class="text-xl font-bold">Projectile Motion Explorer</h1><div class="text-xs opacity-80">Adjust sliders and launch to see physics in action</div></div><div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4"><div class="space-y-4 bg-slate-100 p-4 rounded-lg"><div><label class="block text-sm font-medium">Angle: <span id="v-ang">45</span>°</label><input type="range" id="ang" min="0" max="90" value="45" class="w-full"></div><div><label class="block text-sm font-medium">Speed: <span id="v-spd">50</span> m/s</label><input type="range" id="spd" min="10" max="100" value="50" class="w-full"></div><div><label class="block text-sm font-medium">Gravity: <span id="v-grv">9.8</span> m/s²</label><input type="range" id="grv" min="1" max="20" step="0.1" value="9.8" class="w-full"></div><div class="flex gap-2 pt-2"><button id="launch" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold transition">Launch 🚀</button><button id="reset" class="flex-1 bg-slate-400 hover:bg-slate-500 text-white py-2 rounded font-bold transition">Reset</button></div></div><div class="md:col-span-3 relative"><canvas id="sim" class="w-full h-64 md:h-80 rounded border"></canvas><div id="stats" class="absolute top-2 left-2 text-xs bg-white/80 p-2 rounded border border-slate-200 hidden"></div></div></div></div><script>const canvas=document.getElementById('sim'), ctx=canvas.getContext('2d'), angIn=document.getElementById('ang'), spdIn=document.getElementById('spd'), grvIn=document.getElementById('grv'), stats=document.getElementById('stats'); let animation, startTime, path=[]; function resize(){canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight;} window.onresize=resize; resize(); function updateLabels(){ ['ang','spd','grv'].forEach(id=>document.getElementById('v-'+id).innerText=document.getElementById(id).value); } [angIn,spdIn,grvIn].forEach(i=>i.oninput=updateLabels); function draw(t){ const a=angIn.value*Math.PI/180, v=spdIn.value, g=grvIn.value, dt=(t-startTime)/1000*2; const x=v*Math.cos(a)*dt, y=v*Math.sin(a)*dt-0.5*g*dt*dt; const scale=canvas.width/250; const px=50+x*scale, py=canvas.height-50-y*scale; if(py > canvas.height-50 || px > canvas.width){ cancelAnimationFrame(animation); stats.innerHTML=`<strong>Result:</strong><br>Range: ${(v*v*Math.sin(2*a)/g).toFixed(2)}m<br>Max Height: ${(Math.pow(v*Math.sin(a),2)/(2*g)).toFixed(2)}m`; stats.classList.remove('hidden'); return; } path.push({x:px, y:py}); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='#cbd5e1'; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(0,canvas.height-50); ctx.lineTo(canvas.width,canvas.height-50); ctx.stroke(); ctx.setLineDash([]); ctx.strokeStyle='#3b82f6'; ctx.lineWidth=3; ctx.beginPath(); path.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke(); ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2); ctx.fill(); animation=requestAnimationFrame(draw); } document.getElementById('launch').onclick=()=>{ cancelAnimationFrame(animation); path=[]; stats.classList.add('hidden'); startTime=performance.now(); animation=requestAnimationFrame(draw); }; document.getElementById('reset').onclick=()=>{ cancelAnimationFrame(animation); path=[]; ctx.clearRect(0,0,canvas.width,canvas.height); stats.classList.add('hidden'); }; updateLabels();</script></body></html>
