<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="bg-gray-50"><div class="min-h-screen flex flex-col lg:flex-row"><div class="w-full lg:w-80 bg-white shadow-xl p-6 space-y-6 flex flex-col border-r border-gray-200"><h2 class="text-2xl font-bold text-gray-800">Controls</h2><div><label class="block text-sm font-medium text-gray-700 mb-2">Angle (°)</label><div class="flex items-center space-x-2"><input type="range" id="angle" min="0" max="90" value="45" step="1" class="flex-1 h-2 bg-gray-200 rounded-lg cursor-pointer accent-blue-500 hover:accent-blue-600[-webkit-appearance:none]"><span id="angleVal" class="font-mono text-lg min-w-[3rem] text-blue-600 font-bold">45°</span></div></div><div><label class="block text-sm font-medium text-gray-700 mb-2">Speed (m/s)</label><div class="flex items-center space-x-2"><input type="range" id="speed" min="10" max="100" value="50" step="1" class="flex-1 h-2 bg-gray-200 rounded-lg cursor-pointer accent-green-500 hover:accent-green-600[-webkit-appearance:none]"><span id="speedVal" class="font-mono text-lg min-w-[3rem] text-green-600 font-bold">50</span></div></div><div><label class="block text-sm font-medium text-gray-700 mb-2">Gravity (m/s²)</label><div class="flex items-center space-x-2"><input type="range" id="grav" min="1" max="20" value="9.8" step="0.1" class="flex-1 h-2 bg-gray-200 rounded-lg cursor-pointer accent-orange-500 hover:accent-orange-600[-webkit-appearance:none]"><span id="gravVal" class="font-mono text-lg min-w-[3rem] text-orange-600 font-bold">9.8</span></div></div><div class="flex space-x-3 pt-4"><button id="launch" class="flex-1 bg-blue-500 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-all duration-200 shadow-lg active:scale-95">🚀 Launch</button><button id="reset" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-4 rounded-xl transition-all duration-200 shadow-lg active:scale-95">🔄 Reset</button></div><p class="text-sm text-gray-500 mt-auto italic">Adjust &amp; Launch to explore!</p></div><div class="flex-1 flex flex-col items-center justify-center p-8 bg-gradient-to-br from-sky-50 to-blue-100"><h1 class="text-4xl lg:text-5xl font-black text-gray-900 mb-8 bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent drop-shadow-2xl">Projectile Explorer</h1><canvas id="canvas" width="700" height="400" class="border-4 border-gray-400/50 rounded-3xl shadow-2xl bg-gradient-to-b from-sky-200 via-blue-100 to-indigo-200 max-w-full mx-auto"></canvas><p class="text-center text-lg text-gray-700 mt-6 font-medium max-w-md mx-auto">Watch the red ball trace a blue arc. Tweak physics live!</p></div></div><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;let angle=45*Math.PI/180,speed=50,g=9.8,launched=false,posX=50,posY=h-100,velX=0,velY=0,trail=[],lastTime=0;document.getElementById('angle').oninput=e=>{angle=parseFloat(e.target.value)*Math.PI/180;document.getElementById('angleVal').textContent=e.target.value+'°'};document.getElementById('speed').oninput=e=>{speed=parseFloat(e.target.value);document.getElementById('speedVal').textContent=speed};document.getElementById('grav').oninput=e=>{g=parseFloat(e.target.value);document.getElementById('gravVal').textContent=g};document.getElementById('launch').onclick=()=>{if(launched)return;launched=true;velX=speed*Math.cos(angle);velY=speed*Math.sin(angle);posX=50;posY=h-100;trail=[]};document.getElementById('reset').onclick=()=>{launched=false;trail=[];posX=50;posY=h-100};function animate(time){const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;ctx.clearRect(0,0,w,h);const groundY=h-40;const grad=ctx.createLinearGradient(0,groundY,0,h);grad.addColorStop(0,'#90EE90');grad.addColorStop(1,'#228B22');ctx.fillStyle=grad;ctx.fillRect(0,groundY,w,40);if(launched){velY-=g*dt;posX+=velX*dt;posY+=velY*dt;trail.push({x:posX,y:posY});if(posY>=groundY+10||posX>w+20){launched=false;trail=[]}}if(trail.length>0){ctx.strokeStyle='#3B82F6';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#60A5FA';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);for(let i=1;i<trail.length;i++)ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();ctx.shadowBlur=0}ctx.save();ctx.fillStyle='#EF4444';ctx.shadowColor='#F87171';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(posX,posY,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore();requestAnimationFrame(animate)}requestAnimationFrame(animate);</script></body></html>
