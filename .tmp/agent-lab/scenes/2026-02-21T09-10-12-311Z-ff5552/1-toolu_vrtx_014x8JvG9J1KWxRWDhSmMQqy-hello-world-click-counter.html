<!doctype html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-6"><div class="bg-white rounded-2xl shadow-lg p-10 flex flex-col items-center gap-6 w-full max-w-sm"><h1 class="text-4xl font-bold text-indigo-600 tracking-tight">Hello World!</h1><p class="text-gray-500 text-sm text-center">Press the button below to count your clicks.</p><div class="flex flex-col items-center gap-2"><span class="text-6xl font-extrabold text-gray-800" id="count">0</span><span class="text-xs text-gray-400 uppercase tracking-widest">clicks</span></div><button id="btn" onclick="increment()" class="mt-2 bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white font-semibold text-lg px-8 py-3 rounded-xl shadow transition-all duration-150 select-none">Click Me!</button><button onclick="reset()" class="text-xs text-gray-400 hover:text-red-400 underline transition-colors">Reset</button></div><script>var n=0;function increment(){n++;document.getElementById('count').textContent=n;}function reset(){n=0;document.getElementById('count').textContent=0;}</script></body></html>
