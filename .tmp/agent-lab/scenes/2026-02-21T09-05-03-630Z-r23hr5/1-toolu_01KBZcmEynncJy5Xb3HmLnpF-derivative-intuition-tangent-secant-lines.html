<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head><body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-3"><div class="w-full max-w-xl"><h1 class="text-lg font-bold text-center text-indigo-300 mb-1">Derivative Intuition: Tangent &amp; Secant Lines</h1><p class="text-xs text-center text-gray-400 mb-3">Drag <span class="text-red-400 font-semibold">P</span> along the curve. Shrink <span class="text-yellow-300">Δx</span> to see the secant approach the tangent.</p><svg id="svg" viewBox="0 0 500 340" class="w-full rounded-xl bg-gray-900 border border-gray-700 touch-none" style="max-height:340px"></svg><div class="mt-3 flex flex-col gap-2"><div class="flex items-center gap-3"><label class="text-xs text-yellow-300 w-20 shrink-0">Δx = <span id="dxVal">1.00</span></label><input id="dxSlider" type="range" min="0.05" max="3" step="0.05" value="1" class="flex-1 accent-yellow-400"/></div><div class="grid grid-cols-2 gap-2 text-xs mt-1"><div class="bg-gray-800 rounded p-2"><span class="text-gray-400">Point P: </span><span id="pInfo" class="text-red-300 font-mono"></span></div><div class="bg-gray-800 rounded p-2"><span class="text-gray-400">Slope (secant): </span><span id="secSlope" class="text-blue-300 font-mono"></span></div><div class="bg-gray-800 rounded p-2"><span class="text-gray-400">f′(x) = 2x: </span><span id="tanSlope" class="text-green-300 font-mono"></span></div><div class="bg-gray-800 rounded p-2"><span class="text-gray-400">Δslope: </span><span id="diff" class="text-yellow-300 font-mono"></span></div></div></div></div><script>(()=>{const svg=document.getElementById('svg');const W=500,H=340;const pad={l:50,r:20,t:20,b:40};const xMin=-3,xMax=3;const yMin=-0.5,yMax=9.5;function tx(x){return pad.l+(x-xMin)/(xMax-xMin)*(W-pad.l-pad.r);}function ty(y){return H-pad.b-(y-yMin)/(yMax-yMin)*(H-pad.t-pad.b);}function fx(x){return x*x;}function mk(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el;}// Axes
const axG=mk('g',{});svg.appendChild(axG);// x axis
axG.appendChild(mk('line',{x1:pad.l,y1:ty(0),x2:W-pad.r,y2:ty(0),stroke:'#4b5563','stroke-width':'1.5'}));// y axis
axG.appendChild(mk('line',{x1:tx(0),y1:pad.t,x2:tx(0),y2:H-pad.b,stroke:'#4b5563','stroke-width':'1.5'}));// ticks
for(let x=xMin;x<=xMax;x++){if(x===0)continue;const lx=mk('line',{x1:tx(x),y1:ty(0)-4,x2:tx(x),y2:ty(0)+4,stroke:'#6b7280','stroke-width':'1'});axG.appendChild(lx);const t=mk('text',{x:tx(x),y:ty(0)+16,'text-anchor':'middle',fill:'#9ca3af','font-size':'10'});t.textContent=x;axG.appendChild(t);}for(let y=0;y<=9;y+=2){const ly=mk('line',{x1:tx(0)-4,y1:ty(y),x2:tx(0)+4,y2:ty(y),stroke:'#6b7280','stroke-width':'1'});axG.appendChild(ly);const t=mk('text',{x:tx(0)-8,y:ty(y)+4,'text-anchor':'end',fill:'#9ca3af','font-size':'10'});t.textContent=y;axG.appendChild(t);}// Curve
const pts=[];for(let i=0;i<=200;i++){const x=xMin+i*(xMax-xMin)/200;pts.push(`${tx(x)},${ty(fx(x))}`);}const curve=mk('polyline',{points:pts.join(' '),fill:'none',stroke:'#818cf8','stroke-width':'2.5'});svg.appendChild(curve);// Secant line
const secLine=mk('line',{stroke:'#facc15','stroke-width':'1.8','stroke-dasharray':'6,3'});svg.appendChild(secLine);// Tangent line
const tanLine=mk('line',{stroke:'#4ade80','stroke-width':'2'});svg.appendChild(tanLine);// Q point
const qCirc=mk('circle',{r:'6',fill:'#3b82f6',stroke:'#bfdbfe','stroke-width':'1.5'});svg.appendChild(qCirc);// P point
const pCirc=mk('circle',{r:'9',fill:'#ef4444',stroke:'#fca5a5','stroke-width':'2',cursor:'grab'});svg.appendChild(pCirc);let px=0.5,dx=1;function clamp(v,a,b){return Math.max(a,Math.min(b,v));}function lineEndpoints(x0,y0,slope){const ext=4;const x1c=xMin-ext,x2c=xMax+ext;return[[x1c,y0+slope*(x1c-x0)],[x2c,y0+slope*(x2c-x0)]];}function render(){const qx=clamp(px+dx,xMin,xMax);const py=fx(px),qy=fx(qx);const slope=(qy-py)/(qx-px);const tanS=2*px;// secant
const[[sx1,sy1],[sx2,sy2]]=lineEndpoints(px,py,slope);secLine.setAttribute('x1',tx(sx1));secLine.setAttribute('y1',ty(sy1));secLine.setAttribute('x2',tx(sx2));secLine.setAttribute('y2',ty(sy2));// tangent
const[[tx1,ty1],[tx2,ty2]]=lineEndpoints(px,py,tanS);tanLine.setAttribute('x1',tx(tx1));tanLine.setAttribute('y1',ty(ty1));tanLine.setAttribute('x2',tx(tx2));tanLine.setAttribute('y2',ty(ty2));// points
pCirc.setAttribute('cx',tx(px));pCirc.setAttribute('cy',ty(py));qCirc.setAttribute('cx',tx(qx));qCirc.setAttribute('cy',ty(qy));// info
document.getElementById('pInfo').textContent=`(${px.toFixed(2)}, ${py.toFixed(2)})`;document.getElementById('secSlope').textContent=slope.toFixed(4);document.getElementById('tanSlope').textContent=tanS.toFixed(4);document.getElementById('diff').textContent=Math.abs(slope-tanS).toFixed(4);}// Drag
let dragging=false;function svgX(e){const r=svg.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;return xMin+(cx-pad.l)/(W-pad.l-pad.r)*(xMax-xMin);}pCirc.addEventListener('pointerdown',e=>{dragging=true;pCirc.setPointerCapture(e.pointerId);e.preventDefault();});svg.addEventListener('pointermove',e=>{if(!dragging)return;px=clamp(svgX(e),xMin,xMax-0.05);render();});svg.addEventListener('pointerup',()=>{dragging=false;});// Slider
const slider=document.getElementById('dxSlider');slider.addEventListener('input',()=>{dx=parseFloat(slider.value);document.getElementById('dxVal').textContent=dx.toFixed(2);render();});render();})();</script></body></html>
